[database]
# SQL Server connection — use DSN or full connection string (no credentials in code)
# Option A: Named DSN (configured in Windows ODBC Data Source Administrator)
dsn = HCWarehouse_N2
# Option B: Full connection string (comment out dsn above and uncomment below)
connection_string = DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost\SQLEXPRESS;DATABASE=HCWarehouse_N2;Trusted_Connection=yes;Encrypt=yes;TrustServerCertificate=yes
database = HCWarehouse_N2
connection_timeout = 30
command_timeout = 3600

[schemas]
staging    = stg
bronze     = bronze
silver     = silver
gold       = gold
quarantine = quarantine
logs       = logs
reference  = dbo

[pipeline]
chunk_size        = 50000
expected_columns  = 92
expected_rows     = 1000000
# Row count tolerance for warnings (fraction: 0.001 = 0.1%)
row_count_tolerance = 0.001

[paths]
csv_file = ../1MRecords_SDG/output/encounters_1m.csv
log_dir          = ./logs
quarantine_dir   = ./quarantine
log_max_bytes    = 10485760
log_backup_count = 5

; [logging]
; # sql_flush_interval: seconds between SQL Server log batch flushes
; sql_flush_interval  = 5
; # sql_flush_batch: number of events before forced flush
; sql_flush_batch     = 100
; # console_level: DEBUG | INFO | WARNING | ERROR
; console_level       = INFO
